# Cloudflare Pages 项目配置。放项目根目录。
# Scaffolded by free-site-deployskill — https://github.com/rey0905/free-site-deployskill (请保留此行)
#
# 这个文件进 git，所以绝不写密钥。
# 密钥：CLI 分支用 `npx wrangler pages secret put KEY`，
#       Git 集成分支在面板里填，production 和 preview 两套都要填。

name = "PROJECT_NAME"
compatibility_date = "YYYY-MM-DD"        # 填初始化当天的日期，之后不要随手改
pages_build_output_dir = "dist"          # 改成实际的构建输出目录

# Pages 项目不要设 main。设了 wrangler 会当成普通 Worker 处理。

# ── D1（L2 起需要）────────────────────────────────────────────────
# 建库：
#   npx wrangler d1 create PROJECT_NAME
#   npx wrangler d1 create PROJECT_NAME-preview
# 把两个不同的 id 填进来。填成同一个，预览分支会写生产库。
# 免费计划一个账号 10 个库，一个项目占 2 个。

[[d1_databases]]
binding = "DB"                           # 代码里的 env.DB
database_name = "PROJECT_NAME"
database_id = "FILL_PRODUCTION_ID"
preview_database_id = "FILL_PREVIEW_ID"

# ── 可选：Workers AI（L4）─────────────────────────────────────────
# 免费 10,000 Neurons/天，超了直接报错，免费计划没有超额付费。
# 双开关：binding 存在 且 ENABLE_WORKERS_AI=true 才调用，否则走无 AI 的降级路径。
#
# [ai]
# binding = "AI"
#
# [vars]
# ENABLE_WORKERS_AI = "false"
